# voice_agent configuration.
#
# Secrets never go in this file. The provider is chosen by the LLM_PROVIDER
# environment variable and its API key comes from the environment too
# (DASHSCOPE_API_KEY for DashScope); see SETUP.md.

# Camera source, language (zh-CN | zh-TW | zh-HK) and the edge-tts voice/player
# are shared with object_narrator. Path is relative to this file.
narrator_config: ../object_narrator/config.yaml

audio:
  # Microphone: sounddevice index or name; null = system default input.
  # List devices with: python -m voice_agent --list-devices
  input_device: null
  sample_rate: 16000       # ASR works best at 16000
  max_record_sec: 20       # recording is cut off after this
  min_record_sec: 0.3      # shorter recordings are treated as "not heard"

  # Voice activity detection instead of push-to-talk. Needs:
  #   pip install webrtcvad-wheels
  vad:
    enabled: false
    aggressiveness: 2      # 0-3; higher filters more background noise
    silence_ms: 800        # this much silence ends an utterance
    start_timeout_sec: 10  # stop waiting if nobody speaks

# Offline recognizer for offline-menu answers only. Cloud speech recognition
# is unusable exactly when the menu is needed, so menu answers are recognized
# on this machine with Vosk, using a grammar built from the menu keywords.
# Download the model as described in SETUP.md. Without it the menu still
# speaks and still accepts typed answers.
local_asr:
  enabled: true
  model_path: ~/.cache/voice_agent/vosk-model-small-cn-0.22

speech_output:
  # edge-tts: object_narrator's Speaker (voice set in the narrator config).
  # provider: the provider's own TTS, falling back to edge-tts if it fails.
  engine: edge-tts
  # Spoken phrases are cached here so fallback phrases work offline.
  cache_dir: ~/.cache/voice_agent/tts

timeouts:                  # seconds; a slower call counts as "offline"
  asr_sec: 15
  llm_sec: 20
  tts_sec: 20
  tool_sec: 20             # first look_around also loads the YOLO model

conversation:
  max_history_turns: 10    # user/assistant pairs kept as context
  max_reply_sentences: 3   # longer model replies are cut to this

# Gestures the model may attach to a reply, e.g.
#   {"say": "你好，我是巴克机器人。", "gesture": "hello"}
# The gesture starts when speech playback starts. Only catalogued names are
# accepted; anything else is logged and dropped, and the reply is still spoken.
# While a gesture is playing (its duration), further requests are skipped
# rather than queued.
gestures:
  enabled: true
  # stub: log the request only, move nothing (works with no robot and no ROS)
  # ros2: publish the gesture name as std_msgs/String on ros2_topic
  backend: stub
  ros2_topic: /gesture/request

  # Which gestures exist, when to use each one, and the few-shot examples for
  # the prompt. Path is relative to this file.
  catalogue_file: gestures.yaml

  # Every turn's chosen gesture (or null) is appended here as one JSON line,
  # for tuning gestures.yaml later. The file rotates, so it cannot grow without
  # bound. Set log_path to "" to turn the log off.
  log_path: ~/.cache/voice_agent/gesture-choices.log
  log_max_bytes: 1000000
  log_backups: 3

# Per-provider settings. Only the section for the active LLM_PROVIDER is used.
providers:
  dashscope:
    llm_model: qwen-plus-character
    asr_model: qwen-audio-3.0-asr-flash
    tts_model: qwen-audio-3.0-tts-plus   # used only when speech_output.engine: provider
    tts_voice: longanyang

# Persona and reply rules. {tools} is replaced with the tool list at startup.
system_prompt: |
  你是巴克机器人，一个友好的人形陪伴机器人。你说的每一句话都会被直接朗读出来。

  说话规则：
  - 用简体中文口语回答，每次两到三句话，简短自然。
  - 不要使用列表、表情符号、Markdown 或英文。
  - 有人问你是谁时，回答以"我是巴克机器人。"开头。
  - 不要提到程序、接口、模型、错误代码等技术内容。

  输出格式：
  只输出一个 JSON 对象，不要输出任何其他文字。
  直接回答：{"say": "要说的话"}
  使用工具：{"tool": "工具名", "args": {}}

  可用工具：
  {tools}

  动作（gesture 字段）：
  可以给回复加上一个动作，动作会在你说话的同时做出来，一次最多一个：
  {"say": "你好，我是巴克机器人。", "gesture": "hello"}
  {gestures}

  当用户问你看到了什么、周围有什么、面前有什么，或任何需要看的问题时，
  必须调用 look_around，不要猜测。look_around 返回的句子会原样朗读给用户，不要改写。

# Fixed phrases spoken when something goes wrong. Keep them friendly and
# non-technical. They are cached as audio at startup so they work offline.
fallback_phrases:
  not_heard: 我没听清，可以再说一遍吗？
  offline: 我现在连不上网络，请稍后再试。
  error: 抱歉，我刚才走神了，请再说一遍。
  tool_failed: 抱歉，我现在看不清周围。

# Spoken menu offered after an "offline" reply. Answer with the keyword (重试)
# or the position (二 / 2 / 第二). All of its audio is cached at startup.
#
# Note: hearing a spoken answer still needs speech recognition, which is the
# service that just failed. Each attempt retries it, so a short outage
# recovers; if it does not, the attempt counts as not understood. In --text
# mode the answer is typed and the menu works with no network at all.
offline_menu:
  enabled: true
  prompt: 我现在连不上网络。你可以说 一 检查设置，二 重试，三 退出。
  # After this many answers that were not understood, the robot speaks
  # `closing` and returns to idle. It never asks again in a loop.
  max_attempts: 2
  closing: 我先休息一下，需要的时候再叫我。
  # One to three options. action: settings | retry | quit
  #   settings - print provider, endpoint and last error in the terminal
  #   retry    - ask the same question again, once
  #   quit     - leave the conversation and return to idle
  options:
    - action: settings
      keyword: 设置
      reply: 好的，我把设置情况显示在屏幕上了。
    - action: retry
      keyword: 重试
      reply: 好的，我再试一次。
    - action: quit
      keyword: 退出
      reply: 好的，我先休息一下。
